[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xpm"
version = "0.1.0"
description = "Explainable-AI IoT predictive maintenance: why did the model flag this machine?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Anmol Agarwal", email = "anmolagarwal2625@gmail.com" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "aiomqtt>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.20,<1.0",
    # shap imports numba, and numba/llvmlite only support numpy<2.4; a newer
    # numpy resolves but fails at `import shap` with a numba ABI error.
    "numpy>=1.26,<2.4",
    "pandas>=2.2,<3.0",
    "pyarrow>=16.0",
    "scipy>=1.13,<2.0",
    "scikit-learn>=1.5,<2.0",
    "lightgbm>=4.3,<5.0",
    "shap>=0.45,<1.0",
    "ucimlrepo>=0.0.7",
    "httpx>=0.27,<1.0",
    "pyyaml>=6.0,<7.0",
    "tdigest>=0.5.2.2,<1.0",
    "orjson>=3.10,<4.0",
    "structlog>=24.1,<26.0",
    "typer>=0.12,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<2.0",
    "pytest-cov>=5.0,<8.0",
    "pytest-benchmark>=4.0,<6.0",
    "ruff>=0.6,<1.0",
    "mypy>=1.11,<2.0",
    "types-PyYAML>=6.0,<7.0",
    "pandas-stubs>=2.2,<3.0",
    "pre-commit>=3.7,<5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/xpm"]

[tool.hatch.build.targets.sdist]
include = ["backend/xpm", "config", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "scripts", "tests"]
# Every entry is written "./name" on purpose. A ruff exclude pattern with no
# path separator is matched against the *basename* of every directory, so a
# bare "data" also silences backend/xpm/data/ and tests/data/ -- real Python
# that must be linted. A pattern containing a separator is resolved relative to
# this file, which anchors it to the repo root. (A leading "/" does not work:
# ruff reads it as an absolute filesystem path and it never matches.)
extend-exclude = [
    "./web",
    "./docs",
    "./data",
    "./models",
    "./reports",
    "./nodered",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["xpm"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B008"]

[tool.mypy]
python_version = "3.12"
# The pydantic plugin synthesises each model's real __init__ signature, so
# `Settings()` type-checks without a `# type: ignore[call-arg]` and a wrong
# field name or type is an error at the call site instead of a runtime
# ValidationError.
plugins = ["pydantic.mypy"]
files = ["backend"]
mypy_path = "backend"
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "shap.*", "sklearn.*", "tdigest.*", "ucimlrepo.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:xpm.*"]
