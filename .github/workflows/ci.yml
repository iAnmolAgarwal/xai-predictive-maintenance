name: ci

on:
  push:
    branches: [main]
  pull_request:

# Push-to-main and pull-request runs live in separate groups, so opening a PR
# from a branch never cancels the main run that publishes images.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.32"

jobs:
  detect:
    # Job-level `if: hashFiles(...)` cannot work: it is evaluated before the
    # workspace exists, so it is always empty. This job checks out first and
    # publishes the same guards as outputs, which keeps main green before the
    # frontend and the contract artefacts exist.
    name: detect optional workspaces
    runs-on: ubuntu-24.04
    outputs:
      web: ${{ steps.probe.outputs.web }}
      contracts: ${{ steps.probe.outputs.contracts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: probe
        run: |
          test -f web/package.json && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          test -f contracts/openapi.json && echo "contracts=true" >> "$GITHUB_OUTPUT" || echo "contracts=false" >> "$GITHUB_OUTPUT"

  backend:
    name: backend (ruff, mypy, pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy --strict backend

      - name: Reject stray coverage pragmas
        # `# pragma: no cover` is allowed only on TYPE_CHECKING blocks and
        # unreachable guards (backend.md §4). Anything else is coverage
        # laundering and fails the build.
        run: |
          if grep -rnE '#\s*pragma:\s*no cover' backend \
              | grep -vE 'TYPE_CHECKING|AssertionError\("unreachable"\)'; then
            echo "::error::unjustified '# pragma: no cover' found"
            exit 1
          fi

      - name: pytest with coverage gate
        run: uv run pytest --cov=backend/xpm --cov-branch --cov-fail-under=85

  web:
    name: web (eslint, tsc, vitest)
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.web == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # There is no root package.json, so the action has nowhere to read
          # `packageManager` from unless it is pointed at the web workspace.
          package_json_file: web/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Generate the TypeScript contracts
        # web/src/contracts/{api,ws}.ts are generated and git-ignored (R15);
        # nothing in web/src typechecks until they exist. Generated from the
        # committed JSON, which contracts-check proves is current.
        run: make contracts-ts

      - name: eslint
        run: pnpm -C web lint

      - name: tsc --noEmit
        run: pnpm -C web exec tsc --noEmit

      - name: vite build
        # Runs before vitest so `no-mock-in-prod` inspects a real dist/ that
        # was built the way the image builds it, instead of spending its own
        # timeout on a cold build (frontend.md §4.1).
        run: pnpm -C web build

      - name: vitest with coverage
        run: pnpm -C web test

      - name: Reject mock code in the production bundle
        # Mirrors web/src/mock/__tests__/no-mock-in-prod.test.ts so the guard
        # holds even if that test is ever weakened: no MSW by path, and none
        # in the contents of any text asset (frontend.md §1.1).
        run: |
          cd web/dist
          paths="$(find . -type f | grep -iE 'mockServiceWorker|msw' || true)"
          bodies="$(grep -rIlE 'mockServiceWorker|msw' . || true)"
          if [ -n "$paths$bodies" ]; then
            echo "::error::mock code reached the production bundle"
            printf '%s\n' "$paths" "$bodies"
            exit 1
          fi

  contracts-check:
    name: contracts are current
    runs-on: ubuntu-24.04
    needs: detect
    if: needs.detect.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Re-export and diff
        run: |
          tmp="$(mktemp -d)"
          uv run python scripts/export_openapi.py --out "$tmp/openapi.json"
          uv run python scripts/export_ws_schema.py --out "$tmp/ws-schema.json"
          diff -u contracts/openapi.json "$tmp/openapi.json"
          diff -u contracts/ws-schema.json "$tmp/ws-schema.json"

  publish-images:
    name: publish images to ghcr
    runs-on: ubuntu-24.04
    needs: [backend, web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && !cancelled() && needs.backend.result == 'success' && needs.web.result != 'failure'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lowercase the owner (GHCR rejects uppercase namespaces)
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push api
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-api:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push replay
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/replay.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-replay:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-replay:latest
          cache-from: type=gha,scope=replay
          cache-to: type=gha,mode=max,scope=replay

      - name: Build and push nodered
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/nodered.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-nodered:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-nodered:latest
          cache-from: type=gha,scope=nodered
          cache-to: type=gha,mode=max,scope=nodered

      - name: Build and push web
        if: hashFiles('web/Dockerfile') != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-web:${{ github.sha }}
            ghcr.io/${{ steps.owner.outputs.lc }}/xpm-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
