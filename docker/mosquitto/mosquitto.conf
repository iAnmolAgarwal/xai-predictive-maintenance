# Mosquitto 2.0 configuration for the xpm lab stack.
#
# Both listeners are anonymous. docker-compose.yml publishes them on the
# loopback interface only (127.0.0.1:1883, 127.0.0.1:9001), so the broker is
# reachable from the compose network and from a developer running the backend
# outside compose, and from nowhere else. There are no credentials in this
# repository by design; adding auth is a deployment concern, not a lab one.

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# Broker-wide limits. The stack's real load is one publisher, one API consumer
# and one Node-RED client at <=25 msg/s of ~1 KB JSON, so these caps are far
# above anything legitimate and still bound what an anonymous client can do.
message_size_limit 262144
max_inflight_messages 40
max_keepalive 120

# `max_connections` is a *per-listener* option in Mosquitto 2.0. Putting it
# here, before the first `listener`, would configure the implicit default
# listener, which then binds 1883 as well and kills the broker at start-up with
# "Error: Address in use". It belongs inside each listener block instead.

# MQTT for the Python publisher, the API consumer and the Node-RED flow.
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true
max_connections 100

# WebSockets, for browser-side debugging of the same topics.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
max_connections 100
